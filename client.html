<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuietPod – Find a Nap Pod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #FDFBF7;
      /* Soft creamy matcha white */
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(134, 160, 88, 0.55);
      --accent-main: #9DB471;
      /* Matcha green */
      --accent-hover: #86A058;
      --accent-glow: rgba(157, 180, 113, 0.3);
      --text-main: #2D332A;
      --text-muted: #7A8775;
      --success: #9DB471;
      /* Matcha */
      --success-bg: rgba(157, 180, 113, 0.15);
      --warning: #F28C9F;
      /* Strawberry pink */
      --warning-bg: rgba(242, 140, 159, 0.15);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-color);
      background-image:
        radial-gradient(circle at 15% 50%, rgba(242, 140, 159, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(157, 180, 113, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: rgba(253, 251, 247, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1.2rem 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #2D332A, #7A8775);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ── Main layout ─────────────────────────────────────────── */
    main {
      max-width: 1024px;
      margin: 0 auto;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h2::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-main);
      box-shadow: 0 0 10px var(--accent-main);
    }

    /* ── Filter bar ──────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255, 255, 255, 0.5);
      padding: 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      width: fit-content;
    }

    .filter-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      background: var(--accent-hover);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ── Boxed sections (shared by forms, list, detail panel) ──── */
    .box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    /* ── Forms ───────────────────────────────────────────────── */
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 1.25rem;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .field label {
      flex: 0 0 110px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .field input,
    .field select,
    .field textarea {
      flex: 1;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
    }

    .field textarea {
      resize: vertical;
      min-height: 2.75rem;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent-main);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .form-submit {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent-hover);
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .form-submit:hover {
      background: var(--accent-main);
    }

    .form-status {
      font-size: 0.85rem;
    }

    .form-status.ok {
      color: var(--success);
    }

    .form-status.error {
      color: var(--warning);
    }

    /* ── Two-column layout: pod list + detail panel ─────────────── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    #status-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* ── Pod list rows ───────────────────────────────────────── */
    #pod-list {
      display: flex;
      flex-direction: column;
    }

    .pod-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0.5rem;
      border-bottom: 1px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .pod-row:last-child {
      border-bottom: none;
    }

    .pod-row:hover {
      background: rgba(157, 180, 113, 0.08);
    }

    .pod-row.selected {
      background: rgba(242, 140, 159, 0.1);
      box-shadow: 0 0 0 1px var(--warning);
    }

    .pod-title {
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-main);
    }

    .pod-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .pod-meta {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
    }

    .pod-price {
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .pod-status {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success);
    }

    .pod-status.occupied {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .detail-delete-btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: #DC3545;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.2rem;
      margin-top: 0.5rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }

    .detail-delete-btn:hover {
      background: #C82333;
    }

    /* ── Detail panel ────────────────────────────────────────── */
    #detail-panel {
      position: sticky;
      top: 6rem;
      min-height: 220px;
    }

    .detail-placeholder {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      text-align: center;
      padding: 1.5rem 0;
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .detail-item label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .detail-item .val {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .detail-item .val.occupied {
      color: var(--warning);
    }

    /* ── Scrollbar ────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <header>
    <h1>QuietPod</h1>
    <p>Nap Pod Rentals</p>
  </header>

  <main>
    <div class="filter-bar">
      <button class="filter-btn active" id="btn-all" onclick="applyFilter('all')">All Pods</button>
      <button class="filter-btn" id="btn-basic" onclick="applyFilter('basic')">Basic</button>
      <button class="filter-btn" id="btn-premium" onclick="applyFilter('premium')">Premium</button>
    </div>

    <div class="box">
      <h2>Add New Pod</h2>
      <form id="addPodForm">
        <div class="form-row">
          <div class="field">
            <label for="podLocation">Location</label>
            <input type="text" id="podLocation" required>
          </div>
          <div class="field">
            <label for="podCategory">Category</label>
            <select id="podCategory" required>
              <option value="" disabled selected></option>
              <option value="Basic">Basic</option>
              <option value="Premium">Premium</option>
            </select>
          </div>
          <div class="field">
            <label for="podHourlyRate">Price</label>
            <input type="number" id="podHourlyRate" min="1" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="form-submit">Add Pod</button>
          <p id="pod-form-status" class="form-status"></p>
        </div>
      </form>
    </div>

    <div class="layout">
      <div class="box">
        <h2>Current Pods (live)</h2>
        <p id="status-msg">Initializing pods...</p>
        <div id="pod-list"></div>
      </div>
      <div class="box" id="detail-panel">
        <h2>Pod Details</h2>
        <p class="detail-placeholder">Select a pod to view details</p>
      </div>
    </div>

    <div class="box">
      <h2>Leave Feedback</h2>
      <form id="feedbackForm">
        <div class="form-row">
          <div class="field">
            <label for="fbName">Name</label>
            <input type="text" id="fbName" required>
          </div>
          <div class="field">
            <label for="fbRating">Rating</label>
            <input type="number" id="fbRating" min="1" max="5" required>
          </div>
          <div class="field">
            <label for="fbComment">Comment</label>
            <textarea id="fbComment" required></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="form-submit">Submit Feedback</button>
          <p id="feedback-form-status" class="form-status"></p>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Tracks whichever filter button is currently active, so actions that
    // refresh the pod list (like adding a new pod) reload the same view
    // the user was already looking at.
    let currentFilter = 'all';

    // ── Load and display the pod list ──────────────────────────────────────────
    async function loadPods(category) {
      const statusMsg = document.getElementById('status-msg');
      const list = document.getElementById('pod-list');
      statusMsg.textContent = 'Fetching available pods...';
      list.innerHTML = '';

      try {
        const url = category && category !== 'all'
          ? `http://localhost:3000/pods?category=${category}`
          : 'http://localhost:3000/pods';
        const response = await fetch(url);
        const pods = await response.json();

        statusMsg.textContent = `${pods.length} pod${pods.length !== 1 ? 's' : ''} matched your criteria`;

        pods.forEach((pod) => {
          const row = document.createElement('div');
          row.className = 'pod-row';
          row.id = `pod-card-${pod.id}`;

          row.innerHTML = `
            <div>
              <div class="pod-title">Pod #${pod.id} &middot; ${pod.category}</div>
              <div class="pod-sub">${pod.location}</div>
            </div>
            <div class="pod-meta">
              <div class="pod-price">₱${pod.hourlyRate}/hr</div>
              <div class="pod-status ${pod.status}">${pod.status}</div>
            </div>
          `;
          row.addEventListener('click', () => loadPodDetail(pod.id, row));
          list.appendChild(row);
        });
      } catch (error) {
        statusMsg.textContent = 'Connection error. Is the server running?';
        console.error(error);
      }
    }

    // ── Load a single pod's details ────────────────────────────────────────────
    async function loadPodDetail(id, clickedRow) {
      document.querySelectorAll('.pod-row').forEach(r => r.classList.remove('selected'));
      clickedRow.classList.add('selected');

      const panel = document.getElementById('detail-panel');
      panel.innerHTML = '<h2>Pod Details</h2><p class="detail-placeholder">Retrieving data...</p>';

      try {
        const response = await fetch(`http://localhost:3000/pods/${id}`);
        if (!response.ok) {
          panel.innerHTML = '<h2>Pod Details</h2><p class="detail-placeholder">Pod data unavailable.</p>';
          return;
        }
        const pod = await response.json();

        panel.innerHTML = `
          <h2>Pod Details</h2>
          <div class="detail-row">
            <div class="detail-item">
              <label>Pod ID</label>
              <div class="val">#${pod.id}</div>
            </div>
            <div class="detail-item">
              <label>Category</label>
              <div class="val">${pod.category}</div>
            </div>
            <div class="detail-item">
              <label>Location</label>
              <div class="val">${pod.location}</div>
            </div>
            <div class="detail-item">
              <label>Current Status</label>
              <div class="val ${pod.status}">${pod.status.charAt(0).toUpperCase() + pod.status.slice(1)}</div>
            </div>
            <div class="detail-item">
              <label>Hourly Rate</label>
              <div class="val">₱${pod.hourlyRate} / hour</div>
            </div>
          </div>
          <button class="detail-delete-btn" id="detail-delete-btn">Delete</button>
        `;
        document.getElementById('detail-delete-btn').addEventListener('click', () => deletePod(pod.id));
      } catch (error) {
        panel.innerHTML = '<h2>Pod Details</h2><p class="detail-placeholder">Error loading details.</p>';
        console.error(error);
      }
    }

    // ── Delete a pod (DELETE /pods/:id) ─────────────────────────────────────────
    async function deletePod(id) {
      if (!confirm(`Delete Pod #${id}? This can't be undone.`)) {
        return;
      }

      try {
        const response = await fetch(`http://localhost:3000/pods/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          alert('Could not delete that pod. It may already be gone.');
          return;
        }

        document.getElementById('detail-panel').innerHTML =
          '<h2>Pod Details</h2><p class="detail-placeholder">Select a pod to view details</p>';
        loadPods(currentFilter);
      } catch (error) {
        alert('Connection error. Is the server running?');
        console.error(error);
      }
    }

    // ── Filter buttons ─────────────────────────────────────────────────────────
    function applyFilter(category) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${category}`).classList.add('active');
      document.getElementById('detail-panel').innerHTML =
        '<h2>Pod Details</h2><p class="detail-placeholder">Select a pod to view details</p>';
      loadPods(category);
    }

    // ── Add-Pod form (POST /pods) ───────────────────────────────────────────────
    document.getElementById('addPodForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusEl = document.getElementById('pod-form-status');
      const newPod = {
        location: document.getElementById('podLocation').value,
        category: document.getElementById('podCategory').value,
        hourlyRate: Number(document.getElementById('podHourlyRate').value)
      };

      try {
        const response = await fetch('http://localhost:3000/pods', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newPod)
        });

        const result = await response.json();

        if (!response.ok) {
          statusEl.textContent = result.error || 'Could not add pod.';
          statusEl.className = 'form-status error';
          return;
        }

        statusEl.textContent = `✓ Pod #${result.id} added successfully!`;
        statusEl.className = 'form-status ok';
        e.target.reset();
        loadPods(currentFilter); // re-run the existing async function that loads /pods
      } catch (error) {
        statusEl.textContent = 'Connection error. Is the server running?';
        statusEl.className = 'form-status error';
        console.error(error);
      }
    });

    // ── Feedback form (POST /feedback) ──────────────────────────────────────────
    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusEl = document.getElementById('feedback-form-status');
      const entry = {
        customerName: document.getElementById('fbName').value,
        comment: document.getElementById('fbComment').value,
        rating: Number(document.getElementById('fbRating').value)
      };

      try {
        const response = await fetch('http://localhost:3000/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        });

        const result = await response.json();

        if (!response.ok) {
          statusEl.textContent = result.error || 'Could not submit feedback.';
          statusEl.className = 'form-status error';
          return;
        }

        statusEl.textContent = `✓ Feedback added successfully!`;
        statusEl.className = 'form-status ok';
        e.target.reset();
      } catch (error) {
        statusEl.textContent = 'Connection error. Is the server running?';
        statusEl.className = 'form-status error';
        console.error(error);
      }
    });

    // ── Run on page load ───────────────────────────────────────────────────────
    loadPods();
  </script>
</body>

</html>
